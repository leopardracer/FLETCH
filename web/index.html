<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FLETCH — the AI on-chain analyst for Robinhood Chain</title>
<meta name="theme-color" content="#FF2D7A" />
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="FLETCH home">
      <img src="mascot.png" alt="" class="brand-cat" width="40" height="40" />
      <span class="brand-text">
        <img src="wordmark.png" alt="FLETCH" class="brand-word" height="22" />
      </span>
    </a>
    <div class="search" id="search" role="search">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search $ticker, name or 0x address" aria-label="Search tokens and wallets"
             aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" />
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <div class="search-results" id="search-results" role="listbox" hidden></div>
    </div>
    <div class="status" id="status">
      <span class="pip" id="status-pip"></span>
      <span id="status-text">connecting…</span>
    </div>
  </header>
  <nav id="navbar" class="navbar"></nav>

  <main id="app"></main>

  <footer>
    <span>Every number here is read from Robinhood Chain or marked unavailable — nothing is invented. Read-only: FLETCH never signs or sends a transaction.</span>
    <nav><a href="https://getfletch.xyz">getfletch.xyz</a><a href="https://github.com/leopardracer/FLETCH" target="_blank" rel="noopener">GitHub</a><a href="https://x.com/leopardracer" target="_blank" rel="noopener">X</a></nav>
  </footer>

  <script src="chatAgent.js"></script>
  <script src="app.js"></script>
</body>
</html>
