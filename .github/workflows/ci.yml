name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite (src/persistence/db.ts) requires Node >=22.5 and simply
        # doesn't exist on Node 20 — this matrix used to include 20.x, which
        # would fail with ERR_UNKNOWN_BUILTIN_MODULE the moment any
        # persistence-dependent test ran. See package.json "engines".
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:coverage
